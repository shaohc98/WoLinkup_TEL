name: wolinkup

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wolinkup
      POSTGRES_USER: wolinkup
      POSTGRES_PASSWORD: wolinkup
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolinkup -d wolinkup"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - wolinkup-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - wolinkup-redis:/data

volumes:
  wolinkup-postgres:
  wolinkup-redis:
