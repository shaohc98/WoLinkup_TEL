<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440, initial-scale=1">
<title>WoLinkup_TEL运营后台原型 · V1.0</title>
<style>
  :root {
    --ink: #101B2D; --bg: #EEF1F5; --panel: #FFFFFF; --line: #E1E5EB; --muted: #67707E; --faint: #9AA3B0;
    --sidebar: #FFFFFF; --sidebar-line: #E1E5EB; --sidebar-text: #58616F; --sidebar-title: #98A1AE; --sidebar-ink: #17202F;
    --primary: #2158D0; --primary-dark: #17419E; --primary-soft: #E8EFFC;
    --green: #1B8A5A; --green-soft: #E3F5EC; --amber: #A9700C; --amber-soft: #FBF0D9; --red: #C0362E; --red-soft: #FBE9E8; --slate-soft: #EEF0F3;
    --r: 8px; --r-lg: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 13.5px; -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); }

  .app { display: flex; min-height: 100vh; }

  /* ---------- sidebar ---------- */
  .sidebar { width: 236px; flex: 0 0 auto; background: var(--sidebar); color: var(--sidebar-text); border-right: 1px solid var(--sidebar-line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; transition: width .18s ease; }
  .sidebar.mini { width: 64px; }
  .brand { position: relative; display: flex; align-items: center; gap: 10px; height: 60px; flex: 0 0 auto; padding: 0 16px; border-bottom: 1px solid var(--sidebar-line); overflow: hidden; }
  .sidebar.mini .brand { padding: 0; justify-content: center; }
  .brand-mark { transition: opacity .15s ease; width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: -.2px; flex: 0 0 auto; }
  .brand-txt { color: var(--sidebar-ink); font-size: 14px; font-weight: 600; line-height: 1.25; white-space: nowrap; }
  .brand-txt small { display: block; font-size: 11px; font-weight: 400; color: var(--sidebar-title); }
  .sidebar.mini .brand-txt { display: none; }
  .nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 12px 12px; }
  .sidebar.mini .nav { padding: 6px 8px 12px; }
  .nav-group { margin-bottom: 4px; }
  .nav-label { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: var(--r); color: var(--sidebar-text); margin-bottom: 2px; white-space: nowrap; }
  .nav-label:hover { color: var(--sidebar-ink); }
  .nav-label > svg:first-child { width: 17px; height: 17px; flex: 0 0 auto; color: var(--sidebar-title); }
  .nav-label:hover > svg:first-child { color: var(--muted); }
  .nav-label .chev { width: 13px; height: 13px; margin-left: auto; color: var(--faint); transition: transform .15s ease; }
  .nav-group.closed .nav-label .chev { transform: rotate(-90deg); }
  .nav-group.closed .nav-item { display: none; }
  .sidebar.mini .nav-label { display: none; }
  .sidebar.mini .nav-group { margin-bottom: 8px; }
  .sidebar.mini .nav-group + .nav-group { border-top: 1px solid var(--sidebar-line); padding-top: 8px; }
  .sidebar.mini .nav-group.closed .nav-item { display: flex; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: var(--r); color: var(--sidebar-text); margin-bottom: 2px; position: relative; white-space: nowrap; }
  .nav-group .nav-item { padding-left: 32px; }
  /* 没有二级菜单的一级菜单：与分组标题同层级，不缩进 */
  .nav-group.solo .nav-item { padding-left: 10px; }
  .nav-item svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--sidebar-title); }
  .nav-item:hover { color: var(--sidebar-ink); }
  .nav-item:hover svg { color: var(--muted); }
  .nav-item.on { background: var(--primary-soft); color: var(--primary-dark); font-weight: 500; }
  .nav-item.on svg { color: var(--primary); }
  .nav-item .cnt { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav-item.on .cnt { color: var(--primary); }
  .sidebar.mini .nav-item { justify-content: center; padding: 10px 0; }
  .sidebar.mini .nav-group.solo .nav-item { justify-content: center; padding: 10px 0; } /* 盖过 .nav-group.solo 的左内边距 */
  .sidebar.mini .nav-item .lbl, .sidebar.mini .nav-item .cnt { display: none; }
  .sidebar.mini .nav-item::after { content: attr(data-label); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); background: var(--sidebar-ink); color: #fff; padding: 5px 9px; border-radius: 6px; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s ease; z-index: 60; }
  .sidebar.mini .nav-item:hover::after { opacity: 1; }
  /* 收起/展开导航：位于左上角标题文字之后的图标按钮 */
  .collapse-btn { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-left: auto; border-radius: 7px; color: var(--sidebar-title); flex: 0 0 auto; }
  .collapse-btn:hover { background: var(--primary-soft); color: var(--primary-dark); }
  .collapse-btn svg { width: 16px; height: 16px; flex: 0 0 auto; transition: transform .18s ease; }
  .sidebar.mini .collapse-btn svg { transform: rotate(180deg); }
  /* 收起后标题文字隐藏：整个标题行成为展开热区，悬停时箭头替换品牌图标 */
  .sidebar.mini .collapse-btn { position: absolute; inset: 0; width: auto; height: auto; margin: 0; border-radius: 0; opacity: 0; }
  .sidebar.mini .brand:hover .collapse-btn, .sidebar.mini .brand:focus-within .collapse-btn { opacity: 1; }
  .sidebar.mini .brand:hover .brand-mark, .sidebar.mini .brand:focus-within .brand-mark { opacity: 0; }

  /* ---------- main / topbar ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 60px; flex: 0 0 auto; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 20; }
  .tb-title h1 { font-size: 17px; font-weight: 600; margin: 0; line-height: 1.25; }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); margin-bottom: 1px; }
  .crumb b { font-weight: 500; color: var(--muted); }
  .tb-right { display: flex; align-items: center; gap: 14px; }
  .search { position: relative; display: flex; align-items: center; gap: 7px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; width: 300px; color: var(--faint); }
  .search svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .search input { border: 0; background: transparent; outline: none; flex: 1; color: var(--ink); min-width: 0; }
  .search input::placeholder { color: var(--faint); }
  .search-clear { display: none; border: 0; background: transparent; color: var(--faint); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
  .search-clear.on { display: block; }
  .search-clear:hover { color: var(--ink); }

  .search-pop { display: none; position: absolute; top: calc(100% + 8px); right: 0; width: 460px; max-height: 480px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: 0 14px 36px rgba(16, 24, 40, .14);
    padding: 6px; z-index: 60; color: var(--ink); text-align: left; }
  .search-pop.on { display: block; }
  .sp-grp + .sp-grp { border-top: 1px solid var(--line); margin-top: 5px; padding-top: 5px; }
  .sp-hd { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 4px; font-size: 11.5px; color: var(--faint); }
  .sp-hd b { font-weight: 600; color: var(--muted); font-size: 12px; }
  .sp-item { display: block; padding: 7px 10px; border-radius: var(--r); text-decoration: none; color: inherit; }
  .sp-item:hover, .sp-item.act { background: var(--bg); }
  .sp-item .t { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .sp-item .t .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-item .t img, .sp-item .t .flag { width: 18px; height: 13px; flex: 0 0 auto; }
  .sp-item .d { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-item em { font-style: normal; color: var(--primary-dark); background: var(--primary-soft); border-radius: 3px; padding: 0 1px; }
  .sp-note { padding: 4px 10px 8px; font-size: 11.5px; color: var(--faint); line-height: 1.8; }
  .sp-chips { padding: 0 10px 8px; }
  .sp-chip { display: inline-block; margin: 4px 5px 0 0; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px;
    font-size: 11.5px; color: var(--muted); background: var(--bg); cursor: pointer; }
  .sp-chip:hover { color: var(--primary-dark); border-color: var(--primary); }
  .sp-ft { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line);
    margin-top: 5px; padding: 9px 10px 6px; font-size: 11.5px; color: var(--faint); }
  .sp-ft a { color: var(--primary-dark); text-decoration: none; font-weight: 600; }
  .sp-kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--panel); }
  .sp-empty { padding: 26px 14px; text-align: center; color: var(--faint); font-size: 12.5px; line-height: 1.9; }
  .sp-empty span { display: block; font-size: 11.5px; }
  .ic-btn { position: relative; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .ic-btn:hover { background: var(--bg); }
  .ic-btn svg { width: 18px; height: 18px; }
  .ic-btn .dot { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 1.5px solid #fff; }
  .admin-wrap { position: relative; }
  .admin-chip { display: flex; align-items: center; gap: 8px; padding: 4px 9px 4px 4px; border-radius: 20px; border: 1px solid var(--line); background: #fff; }
  .admin-chip:hover, .admin-chip.on { background: var(--bg); border-color: #CFD6E0; }
  .admin-chip .av { width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dark); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: 0 0 auto; }
  .admin-chip span { font-size: 12.5px; font-weight: 500; }
  .admin-chip .chev { width: 13px; height: 13px; color: var(--faint); transition: transform .15s ease; }
  .admin-chip.on .chev { transform: rotate(180deg); }
  .admin-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 208px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: 0 12px 32px rgba(16, 27, 45, .14); padding: 6px; display: none; z-index: 40; }
  .admin-menu.on { display: block; }
  .admin-menu .hd { padding: 8px 10px 9px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .admin-menu .hd b { display: block; font-size: 13px; }
  .admin-menu .hd span { font-size: 11.5px; color: var(--muted); }
  .admin-menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; font-size: 12.5px; }
  .admin-menu button:hover { background: var(--bg); }
  .admin-menu button svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--muted); }
  .admin-menu button.danger { color: var(--red); }
  .admin-menu button.danger svg { color: var(--red); }

  .content { flex: 1; padding: 22px 26px 60px; }
  .view { display: none; }
  .view.on { display: block; }

  /* ---------- shared: page head / toolbar / cards ---------- */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
  .page-head h2 { font-size: 15px; margin: 0 0 3px; }
  .page-head p { font-size: 12.5px; color: var(--muted); margin: 0; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--primary); color: #fff; border: 0; border-radius: var(--r); padding: 8px 14px; font-size: 13px; font-weight: 500; }
  .btn:hover { background: var(--primary-dark); }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover { background: var(--bg); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn.danger { background: var(--red); }
  .btn.danger:hover { background: #9C2B25; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .toolbar .fld { display: flex; align-items: center; gap: 7px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; }
  .toolbar .fld svg { width: 14px; height: 14px; color: var(--faint); flex: 0 0 auto; }
  .toolbar input[type=search], .toolbar input[type=text] { border: 0; background: transparent; outline: none; width: 170px; }
  .toolbar select { border: 1px solid var(--line); background: #fff; border-radius: var(--r); padding: 6px 8px; outline: none; }
  .toolbar .sp { flex: 1; }
  .toolbar .cnt { font-size: 12px; color: var(--muted); }

  table.dtable { width: 100%; border-collapse: collapse; }
  table.dtable th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #FAFBFC; }
  table.dtable td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.dtable tbody tr:hover { background: #FAFBFD; }
  table.dtable tbody tr:last-child td { border-bottom: 0; }
  .cc { display: flex; align-items: center; gap: 8px; }
  .cc .flag { font-size: 17px; }
  .cc b { font-weight: 500; font-size: 13px; }
  .cc span { display: block; font-size: 11.5px; color: var(--muted); }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--green-soft); color: var(--green); }
  .pill.warn { background: var(--amber-soft); color: var(--amber); }
  .pill.off { background: var(--slate-soft); color: var(--faint); }
  .pill.fail { background: var(--red-soft); color: var(--red); }
  .pill.info { background: var(--primary-soft); color: var(--primary-dark); }

  .switch { width: 34px; height: 20px; border-radius: 20px; background: #D7DCE3; position: relative; flex: 0 0 auto; border: 0; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch.on { background: var(--green); }
  .switch.on::after { left: 16px; }

  .rowbtn { color: var(--primary); font-size: 12.5px; font-weight: 500; }
  .rowbtn.muted { color: var(--muted); }
  .rowbtn + .rowbtn { margin-left: 12px; }

  .pager { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  .pager .info { font-size: 12px; color: var(--muted); }
  .pager .btns { display: flex; gap: 6px; }
  .pager button { width: 28px; height: 28px; border-radius: var(--r); border: 1px solid var(--line); background: #fff; font-size: 12px; }
  .pager button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pager button[disabled] { opacity: .4; }

  /* stat cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; }
  .kpi .lbl { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .kpi .val { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .kpi .val small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .kpi .delta { font-size: 11.5px; margin-top: 6px; display: inline-flex; align-items: center; gap: 3px; }
  .kpi .delta.up { color: var(--green); }
  .kpi .delta.down { color: var(--red); }

  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  .card-hd { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .card-hd h3 { font-size: 13.5px; margin: 0; }
  .card-hd span { font-size: 11.5px; color: var(--muted); }
  .card-bd { padding: 16px; }

  .bars { display: flex; flex-direction: column; gap: 11px; }
  .bar-row { display: grid; grid-template-columns: 92px 1fr 56px; align-items: center; gap: 10px; font-size: 12.5px; }
  .bar-row .track { height: 8px; border-radius: 4px; background: var(--slate-soft); overflow: hidden; }
  .bar-row .fill { height: 100%; border-radius: 4px; background: var(--primary); }
  .bar-row .n { text-align: right; color: var(--muted); }

  .rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .rank-row:last-child { border-bottom: 0; }
  .rank-row .no { width: 18px; color: var(--faint); font-weight: 600; }
  .rank-row .flag { font-size: 16px; }
  .rank-row .nm { flex: 1; font-weight: 500; }
  .rank-row .v { color: var(--muted); }

  .supplier-mini { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .supplier-mini:last-child { border-bottom: 0; }
  .supplier-mini .dot2 { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .supplier-mini .dot2.ok { background: var(--green); } .supplier-mini .dot2.warn { background: var(--amber); } .supplier-mini .dot2.off { background: var(--faint); }
  .supplier-mini b { font-size: 12.5px; font-weight: 500; display: block; }
  .supplier-mini span { font-size: 11.5px; color: var(--muted); }
  .supplier-mini .v { margin-left: auto; font-size: 12.5px; color: var(--muted); }

  /* tabs inline (settings) */
  .tabs-inline { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .tabs-inline button { padding: 10px 4px; margin-right: 22px; border-bottom: 2px solid transparent; color: var(--muted); font-size: 13.5px; font-weight: 500; }
  .tabs-inline button.on { color: var(--primary); border-bottom-color: var(--primary); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12.5px; color: var(--muted); }
  .field label .req { color: var(--red); }
  .field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; outline: none; background: #fff; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }
  .field .hint { font-size: 11px; color: var(--faint); }
  .field-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .field-row:last-child { border-bottom: 0; }
  .field-row .t { font-size: 13px; font-weight: 500; }
  .field-row .d { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  /* 图标上传与预览 */
  .icon-up { display: flex; align-items: center; gap: 12px; }
  .icon-up input[type="file"] { display: none; }
  .icon-prev { width: 58px; height: 58px; flex: 0 0 auto; border: 1px dashed var(--line); border-radius: 10px; background: #FAFBFC; display: grid; place-items: center; overflow: hidden; }
  .icon-prev img { width: 100%; height: 100%; object-fit: contain; padding: 5px; box-sizing: border-box; display: block; }
  .icon-prev .emoji { font-size: 28px; line-height: 1; }
  .icon-prev .letters { width: 100%; height: 100%; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  .icon-up .ops { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .icon-up .icon-btns { display: flex; gap: 8px; }
  .icon-up .icon-btns .btn { padding: 5px 12px; font-size: 12px; }
  .icon-up .hint { font-size: 11px; color: var(--faint); line-height: 1.5; }
  .flag-img { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; display: inline-block; vertical-align: middle; }
  .op-ico { border-radius: 6px; object-fit: cover; display: inline-block; vertical-align: middle; }

  /* drawer */
  .drawer-mask { position: fixed; inset: 0; background: rgba(15,22,36,.4); display: none; z-index: 100; }
  .drawer-mask.on { display: block; }
  .drawer-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 460px; background: #fff; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(15,22,36,.12); transform: translateX(100%); transition: transform .2s ease; }
  .drawer-mask.on .drawer-panel { transform: translateX(0); }

/* WoLinkup Admin V1.0: 支付渠道与支付方式（增量样式） */
.wp-notice { padding:13px 16px; background:#f3f8fe; border:1px solid #d8e4f2; border-radius:10px; line-height:1.7; color:#34506b; margin-bottom:16px; }
.wp-kpis { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:14px; margin-bottom:18px; }
.wp-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.wp-toolbar { gap:9px; }
.wp-toolbar .fld input { width:220px; }
.wp-scroll { overflow-x:auto; width:100%; }
.wp-scroll table { min-width:1020px; }
.wp-scroll td { line-height:1.6; }
.wp-scroll td b { font-weight:600; }
.wp-sub { font-size:11px; color:var(--muted); margin-top:3px; max-width:250px; }
.wp-pill { display:inline-block; padding:3px 8px; background:#eaf1fd; border-radius:100px; color:#345a91; font-size:11px; font-weight:500; margin:2px; white-space:nowrap; }
.wp-pill.site { background:#eef3f0;color:#397257; }
.wp-pill.pending { background:#fff5e0;color:#9a6412; }
.wp-pill.disabled { background:#f1f3f5;color:#a0aab5; }
.wp-form {display:grid;gap:13px;}
.wp-form label,.wp-form legend,.wp-channel-picker h4 {font-size:12px;color:var(--muted);font-weight:550;}
.wp-form label input:not([type=checkbox]),.wp-form label select,.wp-form label textarea {width:100%;margin-top:6px;display:block;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);}
.wp-form fieldset { border:1px solid var(--line); border-radius:8px; display:flex; gap:20px; }
.wp-form .wp-inline {display:flex;gap:8px;align-items:center;color:var(--ink);}
.wp-form .wp-inline input {margin:0;}
.wp-help {font-size:11.5px;color:var(--muted);line-height:1.7;margin:10px 0;}
.wp-channel-picker h4 {margin:16px 0 8px;}
.wp-channel-row {display:flex;align-items:center;justify-content:space-between;gap:9px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;}
.wp-checkrow {display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0;}
.wp-checkrow span {display:grid;gap:3px;}
.wp-checkrow small {color:var(--muted);font-size:11px;}
.wp-priority {display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;flex:0 0 auto;}
.wp-priority input {width:54px;border:1px solid var(--line);border-radius:6px;padding:5px;}
@media(max-width:1150px){.wp-kpis {grid-template-columns:repeat(2,minmax(130px,1fr));}}
@media(max-width:700px){.wp-kpis {grid-template-columns:1fr 1fr;}.wp-toolbar .fld input {width:165px;}.wp-channel-row{align-items:flex-start;flex-direction:column;}}

  /* V1.1 审核项：右上角通知下拉，仅新增，不改动原通用组件 */
  .notice-wrap { position: relative; }
  .notice-pop { display:none; position:absolute; right:0; top:42px; width:400px; max-height:520px; background:#fff; border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:0 14px 36px rgba(16,24,40,.14); z-index:70; overflow:hidden; }
  .notice-pop.on { display:block; }
  .notice-hd { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; }
  .notice-hd b { font-size:14px; }
  .notice-hd button,.notice-ft button { color:var(--primary); font-size:11.5px; }
  .notice-tabs { display:flex; gap:6px; padding:0 12px 10px; border-bottom:1px solid var(--line); }
  .notice-tabs button { padding:5px 9px; border-radius:999px; background:var(--bg); color:var(--muted); font-size:11.5px; }
  .notice-tabs button.on { background:var(--primary-soft); color:var(--primary-dark); }
  .notice-list { max-height:360px; overflow-y:auto; }
  .notice-item { display:flex; gap:10px; padding:12px 15px; border-bottom:1px solid var(--line); cursor:pointer; }
  .notice-item:hover { background:#FAFBFD; }
  .notice-item.unread { background:#FBFDFF; }
  .notice-mark { width:7px; height:7px; border-radius:50%; margin-top:5px; background:transparent; flex:0 0 auto; }

  .notice-main { min-width:0; flex:1; }
  .notice-title { font-size:12.5px; font-weight:600; }
  .notice-desc { margin-top:3px; font-size:11.5px; color:var(--muted); line-height:1.55; }
  .notice-time { margin-top:5px; font-size:10.5px; color:var(--faint); }
  .notice-ft { padding:10px; text-align:center; }
  .dash-section-title { display:flex; align-items:center; gap:10px; margin:18px 0 10px; color:var(--muted); font-size:12px; font-weight:600; }
  .dash-section-title::after { content:''; height:1px; background:var(--line); flex:1; }
  .dash-kpi-2 { grid-template-columns:repeat(2,1fr); }
  .dash-kpi-3 { grid-template-columns:repeat(3,1fr); }

  .dash-trade-grid { display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:14px; }

  .wu-site-tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; }

  .tabs-inline button.on, .wu-site-tab.on, .wl-sys-tab.on {

  var p = null;

};
function dashDateShift(base, days) {
  var p=base.split('-'), d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function dashRangeLabel(f) {
  if (f.range==='today') return '今日';
  if (f.range==='yesterday') return '昨日';
  if (f.range==='7d') return '近7天';
  if (f.range==='30d') return '近30日';
  return (f.start||'—') + ' 至 ' + (f.end||'—');
}
function dashOrdersByFilter(f) {
  var start=DASH_CUTOFF_DATE,end=DASH_CUTOFF_DATE;
  if(f.range==='yesterday'){ start=end=dashDateShift(DASH_CUTOFF_DATE,-1); }
  else if(f.range==='7d'){ start=dashDateShift(DASH_CUTOFF_DATE,-6); }
  else if(f.range==='30d'){ start=dashDateShift(DASH_CUTOFF_DATE,-29); }
  else if(f.range==='custom'){ start=f.start||DASH_CUTOFF_DATE; end=f.end||DASH_CUTOFF_DATE; }
  return ORDERS.filter(function(o){ var d=o.time.slice(0,10); return d>=start && d<=end; });
}
function dashFilterHtml(key) {
  var f=DASH_FILTERS[key], custom=f.range==='custom';

      DASH_FILTERS[key].range=sel.value;
      renderDashboard();
    });
    var st=document.querySelector('[data-dash-start="'+key+'"]');
    var en=document.querySelector('[data-dash-end="'+key+'"]');
    if(st)st.addEventListener('change',function(){
      DASH_FILTERS[key].start=st.value;
      if(DASH_FILTERS[key].end && st.value>DASH_FILTERS[key].end) DASH_FILTERS[key].end=st.value;
      renderDashboard();

      DASH_FILTERS[key].end=en.value;
      if(DASH_FILTERS[key].start && en.value<DASH_FILTERS[key].start) DASH_FILTERS[key].start=en.value;

/* V2.0: change only the presentation of each system-management content block into tabs. */
var WL_SYS_ACTIVE={sysBasic:0,sysPerm:0,sysSecurity:0,sysAudit:0};
function wlSystemTabs(view,names){
  var root=$('v-'+view);if(!root)return;
  var panels=Array.prototype.slice.call(root.children).filter(function(el){return el.classList.contains('panel');});
  if(!panels.length)return;
  var active=Math.max(0,Math.min(WL_SYS_ACTIVE[view]||0,panels.length-1));
  var bar=document.createElement('div');bar.className='wl-sys-tabs';bar.setAttribute('role','tablist');
  var panes=[];panels.forEach(function(panel,i){
    var tab=document.createElement('button');tab.type='button';tab.className='wl-sys-tab'+(i===active?' on':'');
    tab.textContent=names[i]||'设置 '+(i+1);tab.setAttribute('role','tab');bar.appendChild(tab);
    var pane=document.createElement('div');pane.className='wl-sys-pane'+(i===active?' on':'');pane.setAttribute('role','tabpanel');
    panel.style.marginTop='0';pane.appendChild(panel);panes.push(pane);
    tab.addEventListener('click',function(){WL_SYS_ACTIVE[view]=i;Array.prototype.forEach.call(bar.children,function(b,j){b.classList.toggle('on',j===i);});panes.forEach(function(p,j){p.classList.toggle('on',j===i);});});
  });
  root.insertBefore(bar,root.firstChild);
  panes.forEach(function(p){root.insertBefore(p,bar.nextSibling===null?null:root.lastChild);});
}

    '</div>'+

function wuRegister(){
  var html='<div class="wu-callout">模拟国际站注册：提交时同时建立 1 条注册用户和 1 个 USD 余额账户，仅在浏览器本次会话内有效。</div>'+
    '<div class="form-grid"><div class="field full"><label>姓名</label><input id="wu-reg-name" type="text" placeholder="示例姓名"></div>'+
    '<div class="field full"><label>邮箱</label><input id="wu-reg-email" type="email" placeholder="name@example.com"></div></div>';
  openDrawer('模拟邮箱注册 + 自动开立 USD 账户',html);
  $('drawer-save').addEventListener('click',function(){
    var name=$('wu-reg-name').value.trim(),email=$('wu-reg-email').value.trim().toLowerCase();
    if(!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('请填写姓名及有效邮箱');return;}
    if(WU_INTL_USERS.some(function(u){return u.email.toLowerCase()===email;})){toast('该邮箱已注册');return;}
    var n=WU_INTL_USERS.length+1, now=new Date(), day=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
    var id='WU-'+String(n).padStart(6,'0');
    while(WU_INTL_USERS.some(function(u){return u.id===id;})){n++;id='WU-'+String(n).padStart(6,'0');}
    var w='USD-'+String(n).padStart(6,'0');
    WU_INTL_USERS.unshift({id:id,name:name,email:email,registered:day,status:1});
    WU_USD_ACCOUNTS.push({id:w,userId:id,currency:'USD',availableCents:0,frozenCents:0,status:'active',created:day});
    logAudit('模拟国际站邮箱注册及开立USD账户',id,'新用户与独立USD账户：'+w);
    closeDrawer();wuAccountQuery='';wuAccountStatus='';renderWuAccounts();toast('已模拟注册，并自动创建 '+w);
  });
}
function wuAccountDetail(userId){
  var u=WU_INTL_USERS.filter(function(x){return x.id===userId;})[0],a=wuAccountFor(userId);
  if(!u||!a)return;
  var entries=WU_USD_LEDGER.filter(function(l){return l.accountId===a.id;});
  var hist=entries.length?entries.map(function(l){return '<tr><td>'+esc(l.time)+'</td><td>'+esc(l.type)+'</td><td>'+wuUSD(l.amountCents)+'</td><td>'+wuUSD(l.balanceCents)+'</td></tr>';}).join(''):
    '<tr><td colspan="4">暂无 USD 资金流水</td></tr>';
  var html=wuItem('用户',u.name)+wuItem('邮箱',u.email)+wuItem('用户 ID',u.id)+wuItem('账户 ID',a.id)+wuItem('币种','USD')+
    wuItem('可用余额',wuUSD(a.availableCents))+wuItem('冻结余额',wuUSD(a.frozenCents))+
    wuItem('状态',a.status==='active'?'正常':'已冻结')+
    '<div class="wu-callout" style="margin-top:14px">仅可模拟本地 USD 钱包入账，用于检查一人一户与流水展示，不会修改旧版人民币余额，也不对应真实支付成功。</div>'+
    '<div class="wu-table"><table class="dtable"><thead><tr><th>时间</th><th>类型</th><th>金额</th><th>变动后余额</th></tr></thead><tbody>'+hist+'</tbody></table></div>';
  openDrawer('USD 用户账户 · '+a.id,html,
    '<button type="button" class="btn ghost" id="drawer-cancel">关闭</button>'+
    '<button type="button" class="btn ghost" id="wu-toggle-account">'+(a.status==='active'?'模拟冻结':'模拟解冻')+'</button>'+
    '<button type="button" class="btn" id="wu-demo-credit"'+(a.status!=='active'?' disabled':'')+'>模拟入账</button>');
  $('wu-toggle-account').addEventListener('click',function(){a.status=a.status==='active'?'frozen':'active';logAudit('模拟USD账户状态变更',a.id,a.status);closeDrawer();renderWuAccounts();});
  var credit=$('wu-demo-credit');if(credit)credit.addEventListener('click',function(){
    openDrawer('模拟 USD 入账 · '+a.id,'<div class="wu-callout">仅用于本地界面测试，不会生成真实支付订单或资金余额。</div>'+
      '<div class="field"><label>演示金额（USD）</label><input type="number" min="0.01" max="10000" step="0.01" id="wu-credit-value" placeholder="20.00"></div>');
    $('drawer-save').addEventListener('click',function(){
      var amt=$('wu-credit-value').value;
      if(!/^(?:\d+)(?:\.\d{1,2})?$/.test(amt)){toast('请输入最多两位小数的有效金额');return;}
      var cents=Math.round(Number(amt)*100);
      if(cents<=0||cents>1000000){toast('金额应在 USD 0.01 至 USD 10,000 之间');return;}
      a.availableCents+=cents;
      WU_USD_LEDGER.unshift({accountId:a.id,time:fmtDT(new Date()),type:'模拟入账',amountCents:cents,balanceCents:a.availableCents});
      logAudit('模拟USD余额入账',a.id,wuUSD(cents)+'，仅前端演示');closeDrawer();renderWuAccounts();toast('演示入账已记录');
    });
  });
}

/* 一次检索全部业务对象，返回按对象类型分组的命中结果 */
function globalSearch(q) {
  var res = [];
  var s = (q || '').trim();
  if (!s) return res;
  var k = s.toLowerCase();
  function has() {
    for (var i = 0; i < arguments.length; i++) {
      var v = arguments[i];
      if (v != null && String(v).toLowerCase().indexOf(k) >= 0) return true;
    }
    return false;
  }
  function add(kind, items) { if (items.length) res.push({ kind: kind, label: SEARCH_KIND_META[kind].label, items: items }); }

  add('order', ORDERS.filter(function (o) { return has(o.id, o.phone, o.user.name, o.country.name, o.op.name); }).map(function (o) {
    var m = ORDER_STATUS_META[o.status];
    return {
      id: o.id, title: o.id, mono: 1, pill: '<span class="pill ' + m.cls + '">' + m.label + '</span>',
      desc: o.user.name + ' ' + o.phone + ' · ' + o.country.name + ' ' + o.op.name + ' ' + o.face + ' · ' + money(o.amount) + ' · ' + o.time
    };
  }));

  add('refund', REFUNDS.filter(function (r) { return has(r.id, r.order.id, r.order.user.name, r.order.phone); }).map(function (r) {
    var m = REFUND_STATUS_META[r.status];
    return {
      id: r.id, title: r.id, mono: 1, pill: '<span class="pill ' + m.cls + '">' + m.label + '</span>',
      desc: '原订单 ' + r.order.id + ' · ' + money(r.amount) + ' · ' + r.way + ' · ' + r.source + ' · ' + r.time
    };
  }));

  add('user', USERS.filter(function (u) { return has(u.id, u.name, u.phone, u.email); }).map(function (u) {
    return {
      id: u.id, title: u.name, pill: tierPill(tierOf(u.level)),
      desc: u.id + ' · ' + u.phone + ' · 累计充值 ' + money(u.totalTopup) + ' · 余额 ' + money(u.balance) + ' · ' + u.orders + ' 笔订单'
    };
  }));

  add('ticket', TICKETS.filter(function (t) { return has(t.id, t.user.name, t.order, t.type, t.first); }).map(function (t) {
    var m = TICKET_STATUS_META[t.status];
    return {
      id: t.id, title: t.id, mono: 1, pill: '<span class="pill ' + m.cls + '">' + m.label + '</span>',
      desc: t.type + ' · ' + t.user.name + ' · ' + t.first + ' · ' + t.time
    };
  }));

  var skus = [];
  for (var sid in SUP_SKUS) {
    if (!SUP_SKUS.hasOwnProperty(sid)) continue;
    (function (supId) {
      SUP_SKUS[supId].forEach(function (x) {
        if (!has(x.code, x.country, x.op, x.face)) return;
        var sm = SKU_STATUS_META[x.status];
        var sp = supById(supId);
        skus.push({
          id: supId + '|' + x.code, title: x.code, mono: 1, pill: '<span class="pill ' + sm.cls + '">' + sm.label + '</span>',
          desc: (sp ? sp.name : supId) + ' · ' + x.country + ' ' + x.op + ' ' + x.face + ' · 售价 ' + money(x.price) + ' · ' + x.eta
        });
      });
    })(sid);
  }
  add('sku', skus);

  var opMap = {}, ops = [];
  COUNTRIES.forEach(function (c) {
    c.ops.forEach(function (o) {
      if (!has(o.name)) return;
      if (opMap[o.name]) { opMap[o.name].n++; return; }
      var it = { id: o.name, title: o.name, n: 1, first: c.name, faces: o.faces.length };
      opMap[o.name] = it; ops.push(it);
    });
  });
  ops.forEach(function (it) {
    it.desc = '覆盖 ' + it.n + ' 个国家/地区 · 首个为 ' + it.first + ' · ' + it.faces + ' 档面额';
    it.pill = '<span class="pill info">运营商</span>';
  });
  add('operator', ops);

  add('country', COUNTRIES.filter(function (c) { return has(c.name, c.en, c.code, c.dial); }).map(function (c) {
    return {
      id: c.name, title: c.name, icon: countryFlagHtml(c),
      pill: '<span class="pill ' + (c.status ? 'ok' : 'off') + '">' + (c.status ? '已开通' : '已关闭') + '</span>',
      desc: c.en + ' · +' + c.dial + ' · ' + REGIONS[c.region] + ' · ' + c.ops.length + ' 家运营商 · 本币 ' + c.cur + '（1 ' + c.cur + ' ≈ ' + c.perCny + ' 元）'
    };
  }));

  add('supplier', SUPPLIERS.filter(function (v) { return has(v.id, v.name, v.type, v.regions.join(' ')); }).map(function (v) {
    var hl2 = v.health === 'ok' ? ['ok', '正常'] : v.health === 'warn' ? ['warn', '波动'] : ['fail', '异常'];
    return {
      id: v.id, title: v.name,
      pill: '<span class="pill ' + (v.status ? hl2[0] : 'off') + '">' + (v.status ? hl2[1] : '已停用') + '</span>',
      desc: v.id + ' · ' + v.type + ' · ' + v.regions.join('/') + ' · 成功率 ' + v.successRate + '% · ' + v.avgLatency + ' · ' + v.currency
    };
  }));

  var pages = [];
  NAV.forEach(function (g) {
    g.items.forEach(function (it) {
      if (!has(it.label, g.group)) return;
      pages.push({
        id: it.id, title: it.label, pill: '<span class="pill off">' + (g.group || '一级菜单') + '</span>',
        desc: PAGE_META[it.id] ? PAGE_META[it.id][1] : ''
      });
    });
  });
  add('page', pages);

  return res;
}

/* 点击一条结果：先跳到对应页面并把该条过滤出来，再打开详情抽屉 */
function openSearchHit(kind, id) {
  closeSearchPop();
  if (kind === 'order') { state.qOrder = id; state.orderStatus = ''; showView('orders'); openOrderDetail(id); return; }
  if (kind === 'refund') { state.qRefund = id; state.refundStatus = ''; showView('refunds'); openRefundDetail(id); return; }
  if (kind === 'user') { state.qUser = id; state.userLevel = ''; state.userStatus = ''; showView('customers'); openUserDetail(id); return; }
  if (kind === 'ticket') { state.qTicket = id; state.ticketStatus = ''; state.ticketType = ''; showView('tickets'); openTicket(id); return; }
  if (kind === 'sku') {
    var p = id.split('|');
    state.skuSup = p[0]; state.qSku = p[1] || ''; state.skuStatus = '';
    showView('supplierSku'); toast('已定位到 SKU ' + (p[1] || '')); return;
  }
  if (kind === 'operator') { state.qOperator = id; state.opCountry = ''; showView('operators'); toast('已按运营商「' + id + '」筛选'); return; }
  if (kind === 'country') { state.qCountry = id; state.regionFilter = ''; showView('countries'); toast('已按「' + id + '」筛选'); return; }
  if (kind === 'supplier') { showView('suppliers'); toast('已跳转供应商列表'); return; }
  if (kind === 'page') { showView(id); return; }
}

function closeSearchPop() {
  var pop = $('search-pop');
  if (pop) pop.classList.remove('on');
  searchState.idx = -1;
}
function markSearchActive() {
  var pop = $('search-pop');
  if (!pop) return;
  var items = pop.querySelectorAll('.sp-item');
  Array.prototype.forEach.call(items, function (a, i) {
    if (i === searchState.idx) a.classList.add('act'); else a.classList.remove('act');
  });
}
function runGlobalSearch(q) {
  searchState.q = q;
  searchState.groups = globalSearch(q);
  var t = 0;
  searchState.groups.forEach(function (g) { t += g.items.length; });
  searchState.total = t;
  renderSearchPop();
}
function goSearchAll(q) {
  if (!q) return;
  state.qGlobal = q;
  closeSearchPop();
  showView('searchResult');
}

function renderSearchPop() {
  var pop = $('search-pop');
  if (!pop) return;
  var q = searchState.q;
  searchState.flat = []; searchState.idx = -1;

  if (!q) {
    pop.innerHTML = '<div class="sp-grp"><div class="sp-hd"><b>可以搜什么</b></div>' +
      '<div class="sp-note">订单号 / 退款单号 / 工单号、客户姓名与手机号、国家与运营商、供应商与 SKU、后台功能页面</div>' +
      '<div class="sp-chips">' + searchTips().map(function (t) {
        return '<span class="sp-chip" data-tip="' + esc(t) + '">' + esc(t) + '</span>';
      }).join('') + '</div></div>';
    pop.classList.add('on');
    Array.prototype.forEach.call(pop.querySelectorAll('.sp-chip'), function (c) {
      c.addEventListener('click', function () {
        var v = c.getAttribute('data-tip');
        var inp = $('global-search'); inp.value = v; runGlobalSearch(v);
      });
    });
    return;
  }

  if (!searchState.total) {
    pop.innerHTML = '<div class="sp-empty">没有找到与「' + esc(q) + '」匹配的内容<span>换个订单号、手机号、客户姓名、国家或运营商试试</span></div>';
    pop.classList.add('on');
    return;
  }

  var html = '';
  searchState.groups.forEach(function (g) {
    html += '<div class="sp-grp"><div class="sp-hd"><b>' + g.label + '</b><span>' + g.items.length + ' 条</span></div>';
    g.items.slice(0, SEARCH_POP_LIMIT).forEach(function (it) {
      var i = searchState.flat.length;
      searchState.flat.push({ kind: g.kind, id: it.id });
      html += '<a href="#" class="sp-item" data-i="' + i + '">' +
        '<span class="t">' + (it.icon || '') + '<span class="n' + (it.mono ? ' mono' : '') + '">' + hlText(it.title, q) + '</span>' + (it.pill || '') + '</span>' +
        '<span class="d">' + hlText(it.desc, q) + '</span></a>';
    });
    if (g.items.length > SEARCH_POP_LIMIT) {
      html += '<div class="sp-note">还有 ' + (g.items.length - SEARCH_POP_LIMIT) + ' 条未展示</div>';
    }
    html += '</div>';
  });
  html += '<div class="sp-ft"><span>共 ' + searchState.total + ' 条 · <span class="sp-kbd">↑↓</span> 选择 <span class="sp-kbd">Enter</span> 打开</span>' +
    '<a href="#" id="sp-all">查看全部结果</a></div>';

  pop.innerHTML = html;
  pop.classList.add('on');
  Array.prototype.forEach.call(pop.querySelectorAll('.sp-item'), function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var h = searchState.flat[parseInt(a.getAttribute('data-i'), 10)];
      if (h) openSearchHit(h.kind, h.id);
    });
  });
  var all = $('sp-all');
  if (all) all.addEventListener('click', function (e) { e.preventDefault(); goSearchAll(searchState.q); });
}

function wireGlobalSearch() {
  var inp = $('global-search');
  var box = $('search-box');
  var clr = $('search-clear');

  function syncClear() { if (clr) { if (inp.value) clr.classList.add('on'); else clr.classList.remove('on'); } }

  inp.addEventListener('input', function () { syncClear(); runGlobalSearch(inp.value.trim()); });
  inp.addEventListener('focus', function () { syncClear(); runGlobalSearch(inp.value.trim()); });
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSearchPop(); if (inp.blur) inp.blur(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!searchState.flat.length) return;
      if (e.preventDefault) e.preventDefault();
      var n = searchState.flat.length;
      searchState.idx = e.key === 'ArrowDown'
        ? (searchState.idx + 1) % n
        : (searchState.idx <= 0 ? n - 1 : searchState.idx - 1);
      markSearchActive();
      return;
    }
    if (e.key !== 'Enter') return;
    var q = inp.value.trim();
    if (!q) return;
    if (searchState.idx >= 0 && searchState.flat[searchState.idx]) {
      var h = searchState.flat[searchState.idx];
      openSearchHit(h.kind, h.id);
    } else {
      goSearchAll(q);
    }
  });
  if (clr) {
    clr.addEventListener('click', function () {
      inp.value = ''; syncClear(); searchState.q = ''; searchState.groups = []; searchState.total = 0;
      renderSearchPop(); if (inp.focus) inp.focus();
    });
  }
  if (document && typeof document.addEventListener === 'function') {
    document.addEventListener('click', function (e) {
      if (box && box.contains && e && e.target && box.contains(e.target)) return;
      closeSearchPop();
    });
    document.addEventListener('keydown', function (e) {
      if (!e) return;
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
        if (e.preventDefault) e.preventDefault();
        if (inp.focus) inp.focus();
        runGlobalSearch(inp.value.trim());
      }
    });
  }
}

/* 全部搜索结果页（不在左侧菜单中，由顶部搜索进入） */
function renderSearchResult() {
  var q = (state.qGlobal || '').trim();
  var groups = globalSearch(q);
  var total = 0;
  groups.forEach(function (g) { total += g.items.length; });

  var head = '<div class="page-head"><button type="button" class="btn ghost" id="sr-clear">清空搜索</button></div>';

  if (!q || !total) {
    $('v-searchResult').innerHTML = head + '<div class="panel"><div class="empty">' +
      (q ? '没有找到与「' + esc(q) + '」匹配的内容，换个订单号、手机号、客户姓名或国家试试' : '暂无搜索关键词') + '</div></div>';
    bindSearchResultActs();
    return;
  }

  var kpi = '<div class="panel"><div class="card-hd"><h3>结果分布</h3><span>按对象类型统计</span></div><div class="card-bd">' +
    '<div class="kpi-grid">' + groups.map(function (g) {
      return '<div class="kpi"><div class="lbl">' + g.label + '</div><div class="val">' + g.items.length + '</div></div>';
    }).join('') + '</div></div></div>';

  var body = groups.map(function (g) {
    var rows = g.items.slice(0, SEARCH_PAGE_LIMIT).map(function (it) {
      return '<tr>' +
        '<td><div class="cc">' + (it.icon || '') + '<b' + (it.mono ? ' class="mono"' : '') + '>' + hlText(it.title, q) + '</b></div></td>' +
        '<td style="color:var(--muted)">' + hlText(it.desc, q) + '</td>' +
        '<td>' + (it.pill || '') + '</td>' +
        '<td><a href="#" class="rowbtn" data-sr="1" data-k="' + g.kind + '" data-id="' + esc(it.id) + '">打开</a></td>' +
        '</tr>';
    }).join('');
    var more = g.items.length > SEARCH_PAGE_LIMIT
      ? '<div class="sp-note" style="padding:10px 14px">仅展示前 ' + SEARCH_PAGE_LIMIT + ' 条，共 ' + g.items.length + ' 条</div>' : '';
    var jump = SEARCH_KIND_META[g.kind].page
      ? '<a href="#" class="rowbtn" data-srpage="' + g.kind + '">前往' + g.label + '页</a>' : '<span></span>';
    return '<div class="panel" style="margin-top:14px"><div class="card-hd"><h3>' + g.label + '<span class="cnt">' + g.items.length + '</span></h3>' + jump + '</div>' +
      '<table class="dtable"><thead><tr><th>对象</th><th>摘要</th><th>状态</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>' + more + '</div>';
  }).join('');

  $('v-searchResult').innerHTML = head + kpi + body;
  bindSearchResultActs();
}
function bindSearchResultActs() {
  var root = $('v-searchResult');
  var c = $('sr-clear');
  if (c) c.addEventListener('click', function () {
    state.qGlobal = '';
    var inp = $('global-search'); if (inp) inp.value = '';
    renderSearchResult();
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-sr]'), function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      openSearchHit(a.getAttribute('data-k'), a.getAttribute('data-id'));
    });
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-srpage]'), function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var p = SEARCH_KIND_META[a.getAttribute('data-srpage')].page;
      if (p) showView(p);
    });
  });
}
function wireChrome() {
  /* 侧栏折叠为图标轨道 */
  $('btn-collapse').addEventListener('click', function () {
    state.navMini = !state.navMini;
    $('sidebar').classList.toggle('mini', state.navMini);
    $('btn-collapse').setAttribute('aria-label', state.navMini ? '展开导航' : '收起导航');
    $('btn-collapse').setAttribute('title', state.navMini ? '展开导航' : '收起导航');
  });
  /* 顶栏管理员菜单 */
  var chip = $('admin-chip'), menu = $('admin-menu');
  chip.addEventListener('click', function (e) {
    e.stopPropagation();
    var on = !menu.classList.contains('on');
    menu.classList.toggle('on', on); chip.classList.toggle('on', on);
  });
  menu.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { menu.classList.remove('on'); chip.classList.remove('on'); });
  Array.prototype.forEach.call(menu.querySelectorAll('[data-go]'), function (b) {
    b.addEventListener('click', function () {
      menu.classList.remove('on'); chip.classList.remove('on');
      var go = b.getAttribute('data-go');
      if (go === 'logout') { toast('已退出登录（演示）'); return; }
      showView(go);
    });
  });
  /* V1.1：通知铃铛改为可展开、筛选、已读、跳转的消息列表 */
  var noticePop=$('notice-pop'), noticeCat='all';
  function notices(){
    var firstTask=ABNORMAL_ORDERS[0] && ABNORMAL_ORDERS[0].order.id;
    return [
      {id:'n1',cat:'order',title:'异常订单待核实',desc:firstTask ? ('订单 ' + firstTask + ' 状态异常，请人工核实。') : '有异常充值订单待人工核实。',time:'2 分钟前',unread:true,task:firstTask},
      {id:'n2',cat:'supplier',title:'供应商通道异常',desc:'供应商通道成功率或延迟出现异常，请关注。',time:'18 分钟前',unread:true},
      {id:'n3',cat:'account',title:'账户余额预警',desc:'供应商账户余额低于安全余额，请及时检查。',time:'35 分钟前',unread:true},
      {id:'n4',cat:'system',title:'汇率数据已更新',desc:'今日汇率数据同步完成。',time:'1 小时前',unread:false}
    ];
  }
  var noticeData=notices();
  function renderNotices(){
    var list=noticeData.filter(function(n){return noticeCat==='all'||n.cat===noticeCat;});
    $('notice-list').innerHTML=list.map(function(n){return '<div class="notice-item'+(n.unread?' unread':'')+'" data-notice-id="'+n.id+'"><span class="notice-mark"></span><div class="notice-main"><div class="notice-title">'+esc(n.title)+'</div><div class="notice-desc">'+esc(n.desc)+'</div><div class="notice-time">'+esc(n.time)+'</div></div></div>';}).join('');
    var unread=noticeData.filter(function(n){return n.unread;}).length;
    $('notice-unread').textContent=unread ? '('+unread+' 未读)' : '';
    $('bell-dot').style.display=unread ? '' : 'none';
    Array.prototype.forEach.call($('notice-list').querySelectorAll('[data-notice-id]'),function(el){el.addEventListener('click',function(){var n=noticeData.filter(function(x){return x.id===el.getAttribute('data-notice-id');})[0];n.unread=false;renderNotices();if(n.task){noticePop.classList.remove('on');showView('abnormalOrders');setTimeout(function(){openAbnormalOrder(n.task);},0);}});});
  }
  $('btn-bell').addEventListener('click', function (e) { e.stopPropagation(); noticePop.classList.toggle('on'); renderNotices(); });
  noticePop.addEventListener('click',function(e){e.stopPropagation();});
  Array.prototype.forEach.call($('notice-tabs').querySelectorAll('[data-notice-cat]'),function(b){b.addEventListener('click',function(){noticeCat=b.getAttribute('data-notice-cat');Array.prototype.forEach.call($('notice-tabs').querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});renderNotices();});});
  $('notice-read-all').addEventListener('click',function(){noticeData.forEach(function(n){n.unread=false;});renderNotices();});
  $('notice-view-all').addEventListener('click',function(){toast('当前消息已在通知面板中完整展示（V1.1 原型）');});
  document.addEventListener('click',function(){noticePop.classList.remove('on');});
  renderNotices();
}
function init() {
  buildViewShells();
  wireChrome();
  showView('dashboard'); /* showView 内部会 renderNav */
  wireGlobalSearch();
  $('drawer').addEventListener('click', function (e) { if (e.target.id === 'drawer') closeDrawer(); });
  $('drawer-close').addEventListener('click', closeDrawer);
}
init();

</script>
