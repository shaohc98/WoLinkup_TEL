name: wolinkup-tel-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: wolinkup
      POSTGRES_USER: wolinkup
      POSTGRES_PASSWORD: wolinkup
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolinkup -d wolinkup"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - wolinkup_postgres_data:/var/lib/postgresql

volumes:
  wolinkup_postgres_data:
